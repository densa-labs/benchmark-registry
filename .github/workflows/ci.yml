name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Typecheck app
        run: npm run typecheck

      - name: Lint app
        run: npm run lint

      - name: Run frontend and API tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Verify initial HTML SEO and sitemap
        run: npm run test:seo

      - name: Validate migrations
        run: npm run db:migrate:local

  python:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestor

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ingestor/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: ingestor/uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --all-groups

      - name: Lint Python
        working-directory: .
        # From the root, ingestor/ uses its pyproject rules; scripts use ruff defaults.
        run: uv run --project ingestor ruff check ingestor scripts app/scripts data/evidence

      - name: Run Python tests
        run: uv run pytest

      - name: Run script tests
        run: uv run pytest ../scripts

      - name: Validate tracked data
        run: uv run python ../scripts/validate_data.py

      - name: Replay the batch manifest twice
        run: uv run python ../scripts/check_replay.py
