[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "benchmark-registry-ingestor"
version = "0.1.0"
description = "Controlled ingestion CLI for Benchmark Registry"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
registry-ingest = "benchmark_registry_ingestor.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_registry_ingestor"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
